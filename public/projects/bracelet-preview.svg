<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f7f4"/>
      <stop offset="100%" stop-color="#eaf1e5"/>
    </linearGradient>
    <linearGradient id="jet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9c48a"/>
      <stop offset="100%" stop-color="#b39756"/>
    </linearGradient>
    <linearGradient id="sagebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf1e5"/>
      <stop offset="100%" stop-color="#dce5d7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg2)"/>

  <!-- Product image panel -->
  <rect x="80" y="90" width="520" height="720" rx="24" fill="url(#sagebg)"/>
  <!-- bracelet -->
  <ellipse cx="340" cy="450" rx="150" ry="150" fill="none" stroke="url(#gold)" stroke-width="34"/>
  <ellipse cx="340" cy="450" rx="150" ry="150" fill="none" stroke="#1d2a1f" stroke-width="10" stroke-dasharray="18 26"/>
  <circle cx="340" cy="300" r="18" fill="url(#gold)"/>
  <circle cx="440" cy="360" r="10" fill="#f5f2e8"/>
  <circle cx="470" cy="470" r="12" fill="url(#gold)"/>
  <circle cx="420" cy="570" r="10" fill="#f5f2e8"/>
  <circle cx="250" cy="590" r="12" fill="url(#gold)"/>
  <circle cx="205" cy="480" r="10" fill="#f5f2e8"/>

  <!-- Thumbnails -->
  <rect x="120" y="700" width="80" height="80" rx="12" fill="#ffffff" stroke="#c3d6bd" stroke-width="2"/>
  <rect x="216" y="700" width="80" height="80" rx="12" fill="#ffffff" stroke="#dce5d7"/>
  <rect x="312" y="700" width="80" height="80" rx="12" fill="#ffffff" stroke="#dce5d7"/>
  <rect x="408" y="700" width="80" height="80" rx="12" fill="#ffffff" stroke="#dce5d7"/>

  <!-- Info panel -->
  <text x="648" y="180" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#91ad86" letter-spacing="2">HANDCRAFTED COLLECTION</text>
  <text x="648" y="248" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800" fill="#263d2c">Aurelia Bracelet</text>
  <text x="648" y="290" font-family="Inter, Arial, sans-serif" font-size="18" fill="#697568">18k gold plated · Adjustable · One size</text>

  <text x="648" y="360" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#263d2c">$84.00</text>
  <rect x="800" y="326" width="96" height="32" rx="16" fill="#eaf1e5"/>
  <text x="820" y="347" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#4a6345">IN STOCK</text>

  <rect x="648" y="396" width="472" height="1" fill="#dce5d7"/>

  <text x="648" y="442" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4a6345">A minimalist bracelet handcrafted from durable</text>
  <text x="648" y="468" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4a6345">woven cord and finished with a gold clasp —</text>
  <text x="648" y="494" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4a6345">made to wear every day.</text>

  <!-- Size selector -->
  <text x="648" y="552" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#263d2c" letter-spacing="1">SIZE</text>
  <rect x="648" y="566" width="60" height="46" rx="10" fill="#eaf1e5" stroke="#91ad86" stroke-width="2"/>
  <text x="671" y="596" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#263d2c">S</text>
  <rect x="720" y="566" width="60" height="46" rx="10" fill="#ffffff" stroke="#dce5d7"/>
  <text x="743" y="596" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4a6345">M</text>
  <rect x="792" y="566" width="60" height="46" rx="10" fill="#ffffff" stroke="#dce5d7"/>
  <text x="815" y="596" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4a6345">L</text>

  <!-- CTA -->
  <rect x="648" y="648" width="472" height="60" rx="14" fill="url(#gold)"/>
  <text x="884" y="685" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#1d2a1f" text-anchor="middle">Add to Cart — $84.00</text>

  <rect x="648" y="724" width="230" height="52" rx="14" fill="#ffffff" stroke="#dce5d7"/>
  <text x="763" y="756" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#4a6345" text-anchor="middle">Free shipping</text>
  <rect x="890" y="724" width="230" height="52" rx="14" fill="#ffffff" stroke="#dce5d7"/>
  <text x="1005" y="756" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#4a6345" text-anchor="middle">30-day returns</text>
</svg>